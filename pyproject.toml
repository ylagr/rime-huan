[project]
name = "moran"
version = "0.1.0"
description = ""
authors = [
    {name = "ksqsf", email = "i@ksqsf.moe"},
]
dependencies = [
    "OpenCC",
    "pypinyin",
    "regex",
    "pandas",
    "python-dotenv",
    "requests",
    "mdict_utils",
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = {text = "GPLv3"}

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pandas-stubs",
    "types-requests",
    "types-regex",
    "ruff",
]

[tool.pdm]
distribution = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "dist",
]

[tool.ruff.lint]
select = ["E9", "F401", "F541", "I"]

[tool.mypy]
python_version = "3.12"
files = ["tools"]

[[tool.mypy.overrides]]
module = [
    "opencc.*",
    "pypinyin.*",
    "mdict_utils.*",
    "tiktoken.*",
]
ignore_missing_imports = true
