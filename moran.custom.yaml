patch:
  moran/inject_fixed_chars: true
  switches/@2/reset: 1
  switches/@3/reset: 0
  switches/@5/reset: 1
  switches/@6/reset: 0
  "menu/page_size": 6
  key_binder/bindings/+:
    - {when: always, accept: Control+Shift+asterisk, toggle: ascii_punct}
    - {when: has_menu, accept: Shift+Tab, send: Control+Left}

    
