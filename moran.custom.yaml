patch:
  
  schema/dependencies/+: [moran_japanese]
  engine/translators/+:
    # - table_translator@japanese  #混入正常输入
    - table_translator@japanese_o
  schema/dependencies/+:
    - huan
  "menu/page_size": 6
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key/Shift_L: noop
  ascii_composer/switch_key/Shift_R: noop
  ascii_composer/switch_key/Control_L: commit_code
  # ascii_composer/switch_key/Control_R: commit_text
  ascii_composer/switch_key/Control_R: inline_ascii
  ascii_composer/switch_key/Caps_Lock: clear
  ascii_composer/switch_key/Eisu_toggle: clear
  emoji/tips: all
  style/horizontal: false
  fixed/dictionary: moran_fixed_pre
  reverse_tiger/dictionary: huan
  reverse_tiger/tips: 〔环〕
  reverse_tick/dictionary: "huan"
  reverse_tick/tips: 〔环〕
  recognizer/patterns/add_pattern: "^[A-Za-z]+[A-Za-z=_\\-]+$"  # 使-=_在字母后面之后可以当成输入字符处理
  # speller/alphabet: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ/; # 使用默认的
  smart/contextual_suggestions: false  # 如果使用contextual suggestion 会导致删除字后打的字受上下文影响
  smart/preedit_format/+:
    - xform|([a-z][a-z][a-z][a-z]?)/|$1°|
  smart/max_word_length: 10 # 只能记录单次上屏记录，如果使用选词上屏的词不会记录，所以只能使用造词上屏,包括用tab选段落上屏的也不算，必须直接上屏才能记录为max_word
  smart/core_word_length: 4
  # grammar: {}  # 禁用整句模型
  moran/inject_fixed_words: true
  moran/inject_fixed_chars: true
  moran/enable_quick_code_hint: true
  moran/quick_code_hint_indicator: "⚡"
  moran/quick_code_indicator: "🦄"
  moran/sentence_indicator: "💧"
  moran/ijrq/enable_word: true
  moran/ijrq/suffix: "/"
  moran/enable_aux_hint: true
  moran/word_filter_match_indicator: "🎯"
  moran/pin/panacea/freestyle: true
  # moran/enable_word_filter: true
  'engine/filters/@before 6':
    simplifier@mine_simplifier
  'engine/translators/+':
    # - lua_translator@*ylagr.commit_history
    # - lua_translator@*ylagr.ijjp
    - lua_translator@*ylagr.input_statistics
  mine_simplifier:
    opencc_config: moran_mine_t2s.json
    option_name: mine_t_to_s
    # tips: all
    tags: [abc, number]
  'switches/+':
    - name: mine_t_to_s
      reset: 0
      states: [ "源", "私" ]
  switches/@0/reset: 0 #中文
  switches/@1/reset: 0 #半角
  switches/@2/reset: 1 #简体
  # switches/@2:
      # states: [ "漢字", "汉字", "私"]
      # reset: 1
      # options: [ src, simplification, mine_t_to_s ]
  switches/@3/reset: 0 #标点
  switches/@4/reset: 1 #通用/增广
  switches/@5/reset: 1 #固词
  switches/@6/reset: 0 #emoji
  switches/@7/reset: 0 #拆分
  switches/@8/reset: 0 #拼音
  switches/@9/reset: 0 #Uni提示
  switches/@10/reset: 0 #字集

  'engine/processors/@before 0':
    lua_processor@*ylagr.select_character
  'engine/processors/@before 1':
    lua_processor@*ylagr.raw_origin_commit
  # 'engine/processors/+':
    # - lua_processor@*ylagr*init
  key_binder/bindings/+:
    - {when: always, accept: Control+Shift+asterisk, toggle: ascii_punct}
    - {when: has_menu, accept: Shift+Tab, send: Control+Left}
    - {when: has_menu, accept: Control+j, toggle: mine_t_to_s }
    - { when: has_menu, accept: minus, send: minus }
    - { when: has_menu, accept: equal, send: equal }
    - { when: has_menu, accept: Shift+minus, send: underscore }
  moran/fix_end/+:
    a: 啊
    b: 吧
    c: 才
    d: 的
    e: 额
    f: 非
    g: 个
    h: 和
    i: 出
    j: 就
    k: 可
    l: 了
    m: 吗
    n: 那
    o: 哦
    p: 平
    q: 去
    r: 人
    s: 三
    t: 他
    u: 是
    v: 这
    w: 为
    x: 像
    y: 又
    z: 在

    
